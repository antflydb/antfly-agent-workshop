schema_version: 1
id: searchaf-agent
title: Prototype locally and deploy independently
subtitle: Extract with SearchAF, publish selected evidence to Antfly Cloud, and deploy a private support agent.
outcome: Verify a local corpus, publish it and configure hosted retrieval, and prove cited hosted answers work with the local runtime stopped.
maturity: experimental
audience:
  - developers
  - workshop facilitators
skills:
  required:
    - build-antfly-searchaf-agent
starters:
  - guides/searchaf-agent/starter
security:
  credential_scope: Separate publication credentials and table-scoped read-only Cloud retrieval key; server-only OpenAI key; private single-owner corpus.
  tool_policy: guides/searchaf-agent/AGENT-HANDOFF.md
evaluations:
  - guides/searchaf-agent/evaluations.json
verification:
  - Native MCP tools, table and index discovered independently of the model.
  - Known content retrieved from approved roots.
  - Real model answer contains verified citation IDs and supporting evidence.
  - Build and scope/citation tests pass.
  - Selected full-body publication, hashes and named-source Cloud passage parity verified.
  - Private hosted sign-in, denial and answers verified with the local runtime stopped.
compatibility:
  operating_system: macOS; original prototype on Apple Silicon
  runtime: Python 3.12 and Node 22.13 or later; optional local path uses pinned tunnel-client 0.0.14
  data: Local SearchAF extraction baseline and dedicated versioned Cloud corpus; Cloud retrieval supplied in all three apps
  agent_handoff: Codex or Claude Code can read the repository instructions; Sites publishing requires Sites tools/access
provenance:
  repository: antflydb/antfly-skills
